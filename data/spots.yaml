# Shakka spot profiles. Field guide: docs/SPOT_DATA.md
# After editing run: cd ingest && uv run shakka spots validate
# Never guess facts: leave a field out when unsure and keep verified: false.
#
# Research pass 2026-10-16 (verified: true only where Lars confirmed it):
# - lat/lon: nearest point on the OpenStreetMap shoreline to the place (Nominatim), not a confirmed launch spot.
# - shore_normal_deg: computed from ~1 km of OSM shoreline (coastline: water on the right; lakes: point-in-water test).
# - rws_station: nearest station from `shakka tides stations`.
# - status/level/season/hazards/notes: only where a source was found; sources in the comment above each spot.
